<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Student Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

  <!-- AUTH CONTAINER (Shown when NOT logged in) -->
  <div id="authContainer" class="w-full max-w-md bg-white p-8 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-slate-900">University Student Support</h2>
    <p class="text-xs text-center text-slate-500 mb-6">AI Voice Assistant Challenge</p>
    
    <div id="authError" class="mb-4 p-3 bg-red-100 text-red-700 text-sm rounded hidden"></div>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="emailInput" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="uXXXXXXX@uel.ac.uk">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="passwordInput" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
      </div>
      <div class="flex gap-2 pt-2">
        <button type="submit" id="loginBtn" class="flex-1 bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition text-sm font-medium">Sign In</button>
        <button type="button" id="signupBtn" class="flex-1 bg-slate-600 text-white p-2 rounded hover:bg-slate-700 transition text-sm font-medium">Sign Up</button>
      </div>
    </form>
  </div>

  <!-- CHAT CONTAINER (Hidden until logged in) -->
  <div id="chatContainer" class="w-full max-w-xl bg-white rounded-xl shadow-md p-6 hidden flex flex-col h-[650px]">
    <!-- Header with user info & sign out -->
    <div class="flex justify-between items-center border-b pb-4 mb-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">University Student Support</h1>
        <p class="text-xs text-slate-400">AI Voice Assistant Challenge</p>
      </div>
      <div class="text-right">
        <span id="userInfo" class="text-xs text-slate-600 block mb-1"></span>
        <button id="signOutBtn" class="text-xs bg-red-50 text-red-600 px-2.5 py-1 rounded hover:bg-red-100 transition font-medium">Sign Out</button>
      </div>
    </div>

    <!-- Status message -->
    <div id="statusDiv" class="text-center text-xs text-slate-500 mb-3 bg-gray-100 py-1.5 rounded">
      Ready to help. Click Start or Speak below.
    </div>

    <!-- Voice Speak Button -->
    <div class="mb-4 text-center">
      <button id="micBtn" class="w-full bg-blue-600 text-white py-3 px-4 rounded-xl font-medium shadow hover:bg-blue-700 transition flex items-center justify-center gap-2">
        🎙️ Press to Speak
      </button>
    </div>

    <!-- Messages Box -->
    <div id="chatMessages" class="flex-1 overflow-y-auto space-y-3 pr-2 mb-4">
      <div class="bg-blue-50 p-3 rounded-lg text-sm text-slate-700">
        Hey there! Welcome to UEL. How can I help you today—need info on courses, timetables, library hours, or something else?
      </div>
    </div>

    <!-- Input Form -->
    <form id="chatForm" class="flex gap-2 border-t pt-3">
      <input type="text" id="chatInput" placeholder="Or type your question here..." class="flex-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      <button type="submit" id="sendBtn" class="bg-slate-900 text-white px-4 py-2 rounded-lg hover:bg-slate-800 transition text-sm">Send</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://swyuzqsqauyluidwrxfu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_gXwYitwPDAZZjft0wJakXw_lyvuKyxG';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authContainer = document.getElementById('authContainer');
    const chatContainer = document.getElementById('chatContainer');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const authError = document.getElementById('authError');
    const signOutBtn = document.getElementById('signOutBtn');
    const userInfo = document.getElementById('userInfo');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');
    const micBtn = document.getElementById('micBtn');
    const statusDiv = document.getElementById('statusDiv');

    function showError(msg) {
      authError.textContent = msg;
      authError.classList.remove('hidden');
    }

    function updateStatus(text, className) {
      statusDiv.textContent = text;
      statusDiv.className = `text-center text-xs mb-3 py-1.5 rounded ${className || 'bg-gray-100 text-slate-500'}`;
    }

    async function checkUserSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        authContainer.classList.add('hidden');
        chatContainer.classList.remove('hidden');
        userInfo.textContent = `Logged in as: ${session.user.email}`;
      } else {
        authContainer.classList.remove('hidden');
        chatContainer.classList.add('hidden');
      }
    }

    loginBtn.onclick = async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value,
      });
      if (error) {
        showError(error.message);
      } else {
        checkUserSession();
      }
    };

    signupBtn.onclick = async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      const { data, error } = await supabaseClient.auth.signUp({
        email: emailInput.value.trim(),
        password: passwordInput.value,
      });
      if (error) {
        showError(error.message);
      } else {
        alert('Signup successful! You can now sign in.');
      }
    };

    signOutBtn.onclick = async () => {
      await supabaseClient.auth.signOut();
      Object.keys(localStorage).forEach(key => {
        if (key.includes('supabase') || key.includes('sb-')) {
          localStorage.removeItem(key);
        }
      });
      window.location.reload();
    };

    // Send Message Function with Fixed Text-to-Speech Output
    async function sendToServer(text) {
      if (!text) return;

      chatMessages.innerHTML += `<div class="bg-slate-100 p-3 rounded-lg text-sm text-right text-slate-800">${text}</div>`;
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const session = (await supabaseClient.auth.getSession()).data.session;
      const token = session?.access_token || 'bypass-auth';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        
        // Append text reply
        chatMessages.innerHTML += `<div class="bg-amber-50 p-3 rounded-lg text-sm text-slate-800">${data.reply}</div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Speak the reply out loud using browser speech synthesis
        if ('speechSynthesis' in window && data.reply) {
          window.speechSynthesis.cancel(); // Stop any overlapping speech
          
          const utterance = new SpeechSynthesisUtterance(data.reply);
          utterance.rate = 1.0;
          utterance.pitch = 1.0;

          // Select an English voice if available
          const voices = window.speechSynthesis.getVoices();
          const englishVoice = voices.find(v => v.lang.startsWith('en'));
          if (englishVoice) {
            utterance.voice = englishVoice;
          }

          window.speechSynthesis.speak(utterance);
        }

      } catch (err) {
        console.error('Chat error:', err);
      }
    }

    // Ensure voices are preloaded in Chrome
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // Speech Recognition Integration
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      micBtn.onclick = () => {
        try {
          recognition.start();
          updateStatus('Listening...', 'bg-green-100 text-green-700 font-semibold');
        } catch (e) {
          console.error(e);
        }
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        updateStatus('Ready to help. Click Start or Speak below.', 'bg-gray-100 text-slate-500');
        sendToServer(transcript);
      };

      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        updateStatus('Microphone error or permission denied.', 'bg-red-100 text-red-600');
      };

      recognition.onend = () => {
        updateStatus('Ready to help. Click Start or Speak below.', 'bg-gray-100 text-slate-500');
      };
    } else {
      micBtn.onclick = () => {
        alert('Speech recognition is not supported in this browser. Please use Chrome.');
      };
    }

    checkUserSession();
  </script>
</body>
</html>
